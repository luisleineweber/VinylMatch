name: Deploy

on:
  push:
    branches: [ develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-artifact:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: mvn clean test

    - name: Build jar
      run: mvn clean package -DskipTests

    - name: Upload release artifact
      uses: actions/upload-artifact@v7
      with:
        name: VinylMatch-release-${{ github.sha }}
        path: target/VinylMatch.jar
        retention-days: 14

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build-release-artifact
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download release artifact
      uses: actions/download-artifact@v8
      with:
        name: VinylMatch-release-${{ github.sha }}
        path: ./release

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        files: ./release/VinylMatch.jar

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-release-artifact
    if: github.ref == 'refs/heads/develop'
    environment: staging
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

    steps:
    - name: Download release artifact
      uses: actions/download-artifact@v8
      with:
        name: VinylMatch-release-${{ github.sha }}
        path: ./release

    - name: Upload jar to staging host
      if: env.STAGING_SSH_HOST != ''
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ env.STAGING_SSH_HOST }}
        username: ${{ env.STAGING_SSH_USER }}
        key: ${{ env.STAGING_SSH_KEY }}
        source: ./release/VinylMatch.jar
        target: /opt/vinylmatch

    - name: Restart staging service
      if: env.STAGING_SSH_HOST != ''
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.STAGING_SSH_HOST }}
        username: ${{ env.STAGING_SSH_USER }}
        key: ${{ env.STAGING_SSH_KEY }}
        script: |
          sudo install -m 0644 /opt/vinylmatch/release/VinylMatch.jar /opt/vinylmatch/VinylMatch.jar
          sudo systemctl restart vinylmatch-staging
          sudo systemctl is-active --quiet vinylmatch-staging

  deploy-production:
    runs-on: ubuntu-latest
    needs:
    - build-release-artifact
    - publish-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    env:
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}

    steps:
    - name: Download release artifact
      uses: actions/download-artifact@v8
      with:
        name: VinylMatch-release-${{ github.sha }}
        path: ./release

    - name: Upload jar to production host
      if: env.PRODUCTION_SSH_HOST != ''
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ env.PRODUCTION_SSH_HOST }}
        username: ${{ env.PRODUCTION_SSH_USER }}
        key: ${{ env.PRODUCTION_SSH_KEY }}
        source: ./release/VinylMatch.jar
        target: /opt/vinylmatch

    - name: Restart production service
      if: env.PRODUCTION_SSH_HOST != ''
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.PRODUCTION_SSH_HOST }}
        username: ${{ env.PRODUCTION_SSH_USER }}
        key: ${{ env.PRODUCTION_SSH_KEY }}
        script: |
          sudo install -m 0644 /opt/vinylmatch/release/VinylMatch.jar /opt/vinylmatch/VinylMatch.jar
          sudo systemctl restart vinylmatch
          sudo systemctl is-active --quiet vinylmatch
